<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDesk Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/AdminSideMacron.css') }}">
    {% block extra_css %}{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <nav class="sidebar">
        <div class="Brand-section">
            <div class="brand-header">
                <i class="ri-home-smile-line"></i>
                <div>
                    <h2>SmartDesk</h2>
                    <p>Employee Portal</p>
                </div>
            </div>
        </div>

        <div class="nav-container">
            <div class="nav-group">
                <span class="label">Support</span>
                <a href="{{ url_for('admin_dashboard') }}" class="nav-item">
                    <i class="ri-dashboard-line"></i>
                    My Tickets
                </a>
                <a href="#" class="nav-item">
                    <i class="ri-coupon-2-line"></i>
                    IT Support Chat  
                </a>
            </div>
            <div class="my-tickets">20</div>

            <div class="nav-group-emp">
                <span class="label">Resources</span>
                <a href="#" class="nav-item">
                    <i class="ri-bar-chart-2-line"></i>
                    It Knowledge Base
                </a>
                <a href="#" class="nav-item">
                    <i class="ri-export-line"></i>
                    FAQ
                </a>
            </div>

        </div>

        <div class="admin-profile">
            <div class="user-avatar">
                <i class="ri-user-line"></i>
            </div>

            <div class="user-meta">
                <h2>Employee Name</h2>
                <p>employee@gmail.com</p>
            </div>

            <a href="{{ url_for('logout') }}" class="logout-btn">
                <i class="ri-logout-box-r-line"></i>
            </a>
        </div>

    </nav>

    <div style="margin-left: 240px;">
        {% block content %}
        {% endblock %}
    </div>

</body>

</html>
