<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDesk Employee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/EmployeeSideBase.css') }}">
    {% block extra_css %}{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <nav class="sidebar">
        <div class="Brand-section">
            <div class="brand-header">
                <i class="ri-home-smile-line"></i>
                <div>
                    <h2>SmartDesk</h2>
                    <p>Employee Portal</p>
                </div>
            </div>
        </div>

        <div class="nav-container">
            <div class="nav-group">
            <span class="label">Support</span>
            
            <a href="{{ url_for('employee_dashboard') }}" class="nav-item">
                <i class="ri-dashboard-line"></i>
                <span style="flex: 1;">My Tickets</span>
                <div class="my-tickets">{{ tickets | length if tickets else 0 }}</div>
            </a>
            
            <a href="{{ url_for('render_chatbot') }}" class="nav-item">
                <i class="ri-coupon-2-line"></i>
                <span>IT Support Chat</span>  
            </a>
        </div>

            <div class="nav-group">
                <span class="label">Resources</span>
                <a href="#" class="nav-item">
                    <i class="ri-bar-chart-2-line"></i>
                    It Knowledge Base
                </a>
                <a href="#" class="nav-item">
                    <i class="ri-export-line"></i>
                    FAQ
                </a>
            </div>

        </div>

        <div class="admin-profile">
            <div class="user-avatar">
                <i class="ri-user-line"></i>
            </div>

            <div class="user-meta">
                <h2>{{ session['email'].split('@')[0] | capitalize }}</h2>
                <p>{{ session['email'] }}</p>
            </div>

            <a href="{{ url_for('logout') }}" class="logout-btn">
                <i class="ri-logout-box-r-line"></i>
            </a>
        </div>

    </nav>

    <div style="margin-left: 240px;">
        {% block content %}
        {% endblock %}
    </div>

</body>

</html>
